[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "athanor"
version = "0.2.0"
description = "ATHANOR's teachable structural foundation and recurrent neural observer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.14", "mypy>=1.18", "build>=1.3"]
neural = ["torch>=2.10,<3"]

[project.scripts]
athanor-demo = "athanor.demo:main"
athanor-neural-demo = "athanor.neural.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
athanor = ["py.typed"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".tools", "artifacts", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/athanor"]

